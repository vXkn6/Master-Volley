<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — MasterVolley</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'app/css/styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-volleyball-ball"></i>
                    <span>MasterVolley</span>
                </div>
                <p>Ingresa tus credenciales para acceder</p>
            </div>

            <div class="login-body">
                {% if form.errors %}
                <div class="login-errors">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>Usuario o contraseña incorrectos. Intenta de nuevo.</span>
                </div>
                {% endif %}

                <form method="post" class="login-form">
                    {% csrf_token %}
                    <div class="input-group">
                        <input type="text" name="username" placeholder="Usuario" autocomplete="username" required autofocus>
                        <i class="fas fa-user input-icon"></i>
                    </div>
                    <div class="input-group">
                        <input type="password" name="password" id="loginPassword" placeholder="Contraseña" autocomplete="current-password" required>
                        <i class="fas fa-lock input-icon"></i>
                        <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Mostrar contraseña">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                    <button type="submit" class="btn-login">
                        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('loginPassword');
            const icon = document.getElementById('toggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>
</html>
